<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-950 text-slate-100 font-sans min-h-screen relative selection:bg-emerald-500 selection:text-slate-950">
    <header
        class="w-full border-b border-slate-900 bg-slate-950/80 backdrop-blur-md sticky top-0 z-40 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div
                class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-cyan-500 flex items-center justify-center font-black text-xl text-slate-950 shadow-md shadow-emerald-900/20">
                ⚡
            </div>
            <div>
                <h1
                    class="text-lg font-black tracking-tight bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">
                    EQUITABLE VALVE</h1>
                <p class="text-[10px] text-slate-500 font-mono tracking-wider uppercase">Sandbox Pool Ledger Hub</p>
            </div>
        </div>

        <div class="hidden sm:flex gap-1.5 text-[9px] font-mono font-bold uppercase tracking-wider">
            <span class="bg-purple-950/40 text-purple-400 border border-purple-900/50 px-2 py-0.5 rounded">Solana Ref
                System</span>
            <span class="bg-orange-950/40 text-orange-400 border border-orange-900/50 px-2 py-0.5 rounded">ElevenLabs
                Voice</span>
            <span class="bg-cyan-950/40 text-cyan-400 border border-cyan-900/50 px-2 py-0.5 rounded">Google Gemini
                AI</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 pb-32">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-black text-slate-200 tracking-tight flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Active Resilience Queue
            </h2>
            <p class="text-xs text-slate-500 font-medium">Sorted dynamically via live equity vulnerability matrices</p>
        </div>

        <div id="queue-container" class="space-y-4">
        </div>
    </main>

    <div class="fixed bottom-6 right-6 z-50 flex flex-col items-end">
        <div id="intake-panel"
            class="hidden w-80 md:w-96 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-5 mb-4 transform scale-95 opacity-0 origin-bottom-right transition-all duration-300 flex flex-col gap-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <h3 class="text-xs font-black uppercase tracking-wider text-emerald-400">Initialize Field Transmission
                </h3>
                <button id="close-panel-btn"
                    class="text-slate-500 hover:text-slate-300 text-sm font-mono">&times;</button>
            </div>

            <div>
                <label for="raw_transcript"
                    class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Simulated Message
                    Context</label>
                <textarea id="raw_transcript" rows="3"
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-100 placeholder-slate-600 focus:border-emerald-500 focus:outline-none transition-colors"
                    placeholder="Type crisis narrative description parameters here..."></textarea>
            </div>

            <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col gap-3">
                <div class="flex justify-between items-center">
                    <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Acoustic Assets
                        Pipeline</span>
                    <span id="mic-status" class="text-[9px] font-mono text-slate-500 uppercase">System Idle</span>
                </div>

                <div class="flex gap-2">
                    <button id="record-btn"
                        class="w-1/2 bg-red-950/40 hover:bg-red-900/40 border border-red-800/60 text-red-400 font-bold py-2 rounded-lg text-[10px] uppercase tracking-wider transition-all">
                        🔴 Record Mic
                    </button>
                    <label
                        class="w-1/2 bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-300 font-bold py-2 rounded-lg text-[10px] uppercase tracking-wider text-center cursor-pointer transition-all flex items-center justify-center">
                        📁 Attach Audio
                        <input type="file" id="audio-file-input" accept="audio/*" class="hidden">
                    </label>
                </div>
            </div>

            <button id="dispatch-btn"
                class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-2.5 rounded-xl text-xs tracking-wider uppercase transition-all shadow-md active:scale-98">
                Transmit to Global Pool Valve
            </button>
        </div>

        <button id="floating-trigger-btn"
            class="w-14 h-14 bg-gradient-to-tr from-emerald-500 to-teal-600 rounded-full flex items-center justify-center text-slate-950 font-black text-2xl shadow-xl shadow-emerald-950/40 hover:rotate-45 hover:scale-105 active:scale-95 transition-all group duration-300"
            aria-label="Open intake interface terminal">
            <span class="group-hover:scale-110 transition-transform">+</span>
        </button>
    </div>

    <script>
        const API_BASE = window.location.origin + "/api";
        let mediaRecorder;
        let audioChunks = [];
        let activeAudioBlob = null;

        const floatingBtn = document.getElementById('floating-trigger-btn');
        const intakePanel = document.getElementById('intake-panel');
        const closePanelBtn = document.getElementById('close-panel-btn');

        floatingBtn.addEventListener('click', () => {
            intakePanel.classList.remove('hidden');
            setTimeout(() => {
                intakePanel.classList.remove('scale-95', 'opacity-0');
                intakePanel.classList.add('scale-100', 'opacity-100');
            }, 10);
            floatingBtn.classList.add('scale-0', 'opacity-0');
        });

        closePanelBtn.addEventListener('click', () => {
            intakePanel.classList.remove('scale-100', 'opacity-100');
            intakePanel.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                intakePanel.classList.add('hidden');
            }, 300);
            floatingBtn.classList.remove('scale-0', 'opacity-0');
        });

        const recordBtn = document.getElementById('record-btn');
        const micStatus = document.getElementById('mic-status');
        const fileInput = document.getElementById('audio-file-input');
        const dispatchBtn = document.getElementById('dispatch-btn');

        recordBtn.addEventListener('click', async () => {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                recordBtn.innerText = "🔴 Record Mic";
                recordBtn.className = recordBtn.className.replace("bg-red-600", "bg-red-950/40");
                return;
            }

            audioChunks = [];
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    activeAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    micStatus.innerText = "Audio Track Loaded";
                    micStatus.className = "text-[9px] font-mono text-emerald-400 uppercase";
                };

                mediaRecorder.start();
                recordBtn.innerText = "⏹️ Stop Record";
                recordBtn.className = recordBtn.className.replace("bg-red-950/40", "bg-red-600 text-white font-black");
                micStatus.innerText = "STREAMING MIC AUDIO...";
                micStatus.className = "text-[9px] font-mono text-red-400 uppercase animate-pulse";
            } catch (err) {
                console.error("Mic Access Blocked:", err);
                micStatus.innerText = "Mic Error";
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                activeAudioBlob = e.target.files[0];
                micStatus.innerText = "Attached: " + e.target.files[0].name.substring(0, 12) + "...";
                micStatus.className = "text-[9px] font-mono text-cyan-400 uppercase";
            }
        });

        dispatchBtn.addEventListener('click', async () => {
            const textInput = document.getElementById('raw_transcript');
            const dataPayload = new FormData();
            
            if (activeAudioBlob) {
                dataPayload.append('audio_file', activeAudioBlob, 'field_crisis_report.webm');
            } else {
                const dummyBlob = new Blob([textInput.value], { type: 'text/plain' });
                dataPayload.append('audio_file', dummyBlob, 'text_fallback_report.txt');
            }

            micStatus.innerText = "DEPLOYING VALVULAR STREAM...";
            dispatchBtn.disabled = true;
            dispatchBtn.innerText = "Processing Pipeline...";

            try {
                const response = await fetch(`${API_BASE}/voice-intake`, { method: 'POST', body: dataPayload });
                const transientPlaceholderProject = await response.json();
                
                textInput.value = '';
                activeAudioBlob = null;
                micStatus.innerText = "System Idle";
                micStatus.className = "text-[9px] font-mono text-slate-500 uppercase";
                closePanelBtn.click();
                
                renderOrUpdateProjectCard(transientPlaceholderProject, 0.5);
            } catch (error) {
                console.error("Payload transmission failed:", error);
            } finally {
                dispatchBtn.disabled = false;
                dispatchBtn.innerText = "Transmit to Global Pool Valve";
            }
        });

        async function fetchQueue() {
            try {
                const res = await fetch(`${API_BASE}/projects`);
                const data = await res.json();
                document.getElementById('queue-container').innerHTML = '';
                data.forEach(item => renderOrUpdateProjectCard(item.project, item.score));
            } catch (err) { console.error(err); }
        }

        function renderOrUpdateProjectCard(project, score) {
            const container = document.getElementById('queue-container');
            let card = document.getElementById(`card-${project.id}`);
            if (!card) { card = document.createElement('article'); card.id = `card-${project.id}`; container.appendChild(card); }

            if (project.title === "Processing Incoming Voice Assets...") {
                card.className = "bg-slate-900 border border-dashed border-amber-500/30 rounded-2xl p-5 relative overflow-hidden transition-all duration-500 shadow-lg";
                card.innerHTML = `
                    <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-600 animate-pulse"></div>
                    <span class="bg-amber-950/80 text-amber-400 text-[9px] font-black font-mono tracking-wider uppercase border border-amber-900/60 px-2 py-0.5 rounded">🤖 AI Analysis Pipeline Open</span>
                    <h3 class="text-base font-black text-amber-500 tracking-tight mt-2">Computing Pool Allocation Matrix Parameters</h3>
                `;
                initializeServerSentEventPushStream(project.id);
            } else {
                card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl transition-all duration-300 hover:border-emerald-500/20";
                card.innerHTML = `
                    <div class="flex justify-between items-center gap-2 mb-2">
                        <span class="bg-emerald-950/60 text-emerald-400 border border-emerald-900 text-[10px] font-black font-mono px-2 py-0.5 rounded-sm">Priority Metric Index: ${score}</span>
                        <span class="bg-purple-950/40 text-purple-400 border border-purple-900/50 text-[10px] font-mono px-2 py-0.5 rounded-sm">🔑 Slice Pointer: ${project.solana_safe_pda || project.project_reference}</span>
                    </div>
                    <h3 class="text-lg font-black text-slate-100 tracking-tight">${project.title}</h3>
                    <div class="mt-4 space-y-1.5 text-xs font-mono bg-slate-950/80 p-3 rounded-xl border border-slate-900">
                        <div class="flex justify-between"><span class="text-slate-500">Central Master Pool:</span><span class="text-slate-400 text-[11px]">SolMasterPoolHub...</span></div>
                        <div class="flex justify-between pt-1 border-t border-slate-900"><span class="text-slate-400">Allocated Cut:</span><span class="text-emerald-400 font-black">$${parseFloat(project.funding_raised || 0).toLocaleString()} SOL</span></div>
                    </div>
                `;
            }
        }

        function initializeServerSentEventPushStream(projectId) {
            // const eventSource = new EventSource(`${API_BASE}/stream-status/${projectId}`);
            // eventSource.onmessage = function(event) {
            //     if (event.data === "processing") return;
            //     const [title, fundingGoal, computedScore, geohash, solanaSafePda, createdAt] = event.data.split('|');
            //     eventSource.close();
            //     renderOrUpdateProjectCard({ id: projectId, title: title, organization: "On-Ground Youth Collective", funding_goal: fundingGoal, solana_safe_pda: solanaSafePda, geohash: geohash, created_at: createdAt }, computedScore);
            // };
        }

        window.addEventListener('DOMContentLoaded', fetchQueue);
    </script>
</body>

</html>
